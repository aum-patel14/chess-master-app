<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Chessmaster Pro</title>
    <script>
      // GitHub Pages SPA redirect workaround
      // Converts the path into a query parameter so index.html can restore it
      var pathSegmentsToKeep = 1; // /chess-master-app is 1 segment
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .split('/')
            .slice(1 + pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
